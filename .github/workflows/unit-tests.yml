name: Unit tests

on:
  pull_request:
    branches: [ main, prod ]

jobs:
  audit:
    name: Checking
    runs-on: ubuntu-latest
    permissions:
        contents: read
        pull-requests: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          cache: pnpm
          node-version: '24.12.0'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Checking
        run: pnpm prepare && pnpm lint && pnpm typecheck:test && pnpm test:coverage --reporter=default --reporter=json --outputFile=unit-report.json

      - name: Tests summary
        if: always()
        run: pnpm tests:comment unit
        env:
          GITHUB_TOKEN: ${{ github.token }}
